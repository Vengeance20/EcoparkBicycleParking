<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark - Thông tin cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script>
        if (!localStorage.getItem('accessToken')) {
            alert("Bạn chưa đăng nhập!");
            window.location.href = '/RegisterLoginPage.html';
        }
    </script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        input:focus { outline: none; border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            padding: 16px 32px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: all 0.5s ease; opacity: 0; z-index: 1000; max-width: 90vw;
        }
        #toast.show { bottom: 40px; opacity: 1; }
        .toast-success { background: #1e293b; color: white; }
        .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .toast-info { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen pb-24">

<nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-2 text-emerald-600 font-bold text-xl cursor-pointer" onclick="window.location.href='/user-web/UserPage.html'">
        <i class="fas fa-arrow-left text-slate-400 mr-2 hover:text-slate-600"></i>
        <i class="fas fa-bicycle"></i>
        <span>ECOPARK BIKES</span>
    </div>
    <button onclick="logout()" class="text-red-500 font-bold text-sm hover:text-red-700 transition-all bg-red-50 px-4 py-2 rounded-xl">
        <i class="fas fa-sign-out-alt mr-1"></i> Đăng xuất
    </button>
</nav>

<main class="max-w-5xl mx-auto p-6 mt-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <div class="space-y-6">
            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8 flex flex-col items-center text-center">
                <div class="w-28 h-28 rounded-full bg-gradient-to-br from-emerald-400 to-teal-500 text-white flex items-center justify-center text-5xl font-bold shadow-lg mb-4 border-4 border-white" id="bigAvatar">?</div>
                <h2 class="text-xl font-black text-slate-800" id="displayName">Đang tải...</h2>
                <p class="text-sm text-slate-400 mt-1 uppercase font-bold" id="displayRole">CUSTOMER</p>

                <div id="residentBadge" class="hidden mt-3 bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-xs font-black uppercase tracking-wider">
                    <i class="fas fa-check-circle mr-1"></i> Cư dân Ecopark
                </div>

                <div class="mt-6 w-full space-y-4 text-left text-sm bg-slate-50 p-5 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-3 text-slate-600">
                        <i class="fas fa-envelope w-5 text-slate-400 text-center"></i>
                        <span id="displayEmail" class="truncate font-medium">---</span>
                    </div>
                    <div class="flex items-center gap-3 text-slate-600">
                        <i class="fas fa-phone w-5 text-slate-400 text-center"></i>
                        <span id="displayPhone" class="font-medium">---</span>
                    </div>
                    <div class="flex items-center gap-3 text-slate-600">
                        <i class="fas fa-id-card w-5 text-slate-400 text-center"></i>
                        <span id="displayNationalId" class="font-medium">---</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="md:col-span-2 space-y-6">

            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8">
                <h3 class="font-bold text-lg border-l-4 border-emerald-500 pl-3 mb-6 uppercase tracking-wide text-slate-800">Thông tin cá nhân</h3>

                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-user mr-1"></i> Họ và tên</label>
                        <input type="text" id="inputFullName" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold text-slate-700 transition-all" placeholder="Nhập họ và tên của bạn">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-phone mr-1"></i> Số điện thoại</label>
                            <input type="tel" id="inputPhoneNumber" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold text-slate-700 transition-all" placeholder="Nhập SĐT">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-envelope mr-1"></i> Email</label>
                            <input type="email" id="inputEmail" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold text-slate-700 transition-all" placeholder="Nhập Email">
                        </div>
                    </div>
                </div>

                <button onclick="saveProfile()" id="btnSave" class="w-full mt-8 bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Lưu thông tin
                </button>
            </div>

            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8">
                <h3 class="font-bold text-lg border-l-4 border-emerald-500 pl-3 mb-2 uppercase tracking-wide text-slate-800">Xác thực cư dân</h3>
                <p class="text-sm text-slate-500 mb-6">Liên kết thẻ cư dân để nhận các ưu đãi và gói thuê bao đặc quyền từ hệ thống Ecopark Bikes.</p>

                <div class="flex flex-col sm:flex-row gap-4">
                    <div class="relative flex-1">
                        <i class="fas fa-id-badge absolute left-4 top-1/2 -translate-y-1/2 text-emerald-500"></i>
                        <input type="text" id="inputCardId" class="w-full bg-emerald-50 border border-emerald-100 rounded-xl pl-12 pr-4 py-4 font-bold text-emerald-800 placeholder-emerald-300 transition-all focus:ring-4 focus:ring-emerald-200" placeholder="Nhập mã thẻ hoặc CCCD...">
                    </div>
                    <button onclick="verifyResidentCard()" id="btnVerify" class="bg-emerald-500 text-white font-bold px-8 py-4 rounded-xl shadow-lg shadow-emerald-200 hover:bg-emerald-600 transition-all flex items-center justify-center gap-2 whitespace-nowrap">
                        <i class="fas fa-check-circle"></i> Xác thực ngay
                    </button>
                </div>
            </div>

        </div>
    </div>
</main>

<div id="toast">
    <div id="toastIcon" class="w-10 h-10 rounded-full flex items-center justify-center"><i id="faIcon" class="fas"></i></div>
    <div>
        <p id="toastTitle" class="font-bold"></p>
        <p id="toastDesc" class="text-xs opacity-80"></p>
    </div>
</div>

<script>
    const API_BASE_URL = "http://localhost:8080/apiv1/auth";
    let initialData = {};

    // Đã thêm: Hàm lấy Auth Header chung để không bị 403
    function getAuthHeaders() {
        return {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem('accessToken')
        };
    }

    function showToast(type, title, desc) {
        const toast = document.getElementById('toast');
        toast.className = `show ${type === 'success' ? 'toast-success' : (type === 'info' ? 'toast-info' : 'toast-error')}`;
        document.getElementById('toastIcon').className = `w-10 h-10 rounded-full flex items-center justify-center ${type === 'success' ? 'bg-emerald-500 text-white' : (type === 'info' ? 'bg-amber-500 text-white' : 'bg-red-500 text-white')}`;
        document.getElementById('faIcon').className = `fas ${type === 'success' ? 'fa-check' : (type === 'info' ? 'fa-info-circle' : 'fa-exclamation-triangle')}`;
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastDesc').innerText = desc;
        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    function logout() {
        if(confirm("Xác nhận đăng xuất?")) {
            localStorage.removeItem('userData');
            localStorage.removeItem('accessToken'); // Sửa lỗi xóa nhầm biến token
            window.location.href = '/RegisterLoginPage.html';
        }
    }

    function updateDisplay(user) {
        const fullName = user.fullName || 'Người dùng mới';
        document.getElementById('displayName').innerText = fullName;
        document.getElementById('displayEmail').innerText = user.email || 'Chưa cập nhật';
        document.getElementById('displayPhone').innerText = user.phoneNumber || 'Chưa cập nhật';
        document.getElementById('displayNationalId').innerText = user.nationalId || 'Chưa xác thực';
        document.getElementById('displayRole').innerText = user.role || 'CUSTOMER';

        const avatarLetter = fullName !== 'Người dùng mới' ? fullName.charAt(0).toUpperCase() : '?';
        document.getElementById('bigAvatar').innerText = avatarLetter;

        const btn = document.getElementById('btnVerify');

        // BÍ ẨN ĐƯỢC GIẢI MÃ: Kiểm tra cả user.resident (do Spring Boot tự cắt chữ)
        if (user.resident === true || user.isResident === true) {
            // Hiện huy hiệu
            document.getElementById('residentBadge').classList.remove('hidden');
            if(user.residentCardId) document.getElementById('inputCardId').value = user.residentCardId;
            document.getElementById('inputCardId').disabled = true;

            // Đổi nút thành Đã xác thực
            btn.innerHTML = '<i class="fas fa-check"></i> Đã xác thực';
            btn.classList.remove('bg-emerald-500', 'hover:bg-emerald-600');
            btn.classList.add('bg-slate-300');
            btn.disabled = true;
        } else {
            // Nếu chưa xác thực, đảm bảo nút bấm ở trạng thái bình thường (Không bị xoay tròn)
            document.getElementById('residentBadge').classList.add('hidden');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Xác thực ngay';
            btn.disabled = false;
        }
    }

    function loadInitialData() {
        const userData = JSON.parse(localStorage.getItem('userData')) || {};

        initialData = {
            fullName: userData.fullName || '',
            phoneNumber: userData.phoneNumber || '',
            email: userData.email || '',
        };

        document.getElementById('inputFullName').value = initialData.fullName;
        document.getElementById('inputPhoneNumber').value = initialData.phoneNumber;
        document.getElementById('inputEmail').value = initialData.email;

        updateDisplay(userData);
    }

    // =====================================
    // LƯU THÔNG TIN PROFILE (Đã fix Auth)
    // =====================================
    async function saveProfile() {
        const userData = JSON.parse(localStorage.getItem('userData')) || {};
        const userId = userData.userId;

        const currentData = {
            fullName: document.getElementById('inputFullName').value,
            phoneNumber: document.getElementById('inputPhoneNumber').value,
            email: document.getElementById('inputEmail').value,
            nationalId: userData.nationalId // Giữ nguyên nationalId cũ
        };

        if (currentData.fullName === initialData.fullName &&
            currentData.phoneNumber === initialData.phoneNumber &&
            currentData.email === initialData.email) {
            return showToast('info', 'Không có thay đổi', 'Bạn chưa thay đổi thông tin nào.');
        }

        const btn = document.getElementById('btnSave');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/update-profile/${userId}`, {
                method: 'PUT',
                headers: getAuthHeaders(), // Đã thêm chìa khóa Security
                body: JSON.stringify(currentData)
            });

            if (res.ok) {
                const updatedUser = await res.json();
                localStorage.setItem('userData', JSON.stringify(updatedUser));
                loadInitialData(); // Load lại data
                showToast('success', 'Cập nhật thành công', 'Thông tin đã được lưu.');
            } else {
                const errMsg = await res.text();
                showToast('error', 'Cập nhật thất bại', errMsg);
            }
        } catch (error) {
            showToast('error', 'Lỗi', 'Không thể kết nối đến server.');
        } finally {
            btn.innerHTML = '<i class="fas fa-save"></i> Lưu thông tin';
            btn.disabled = false;
        }
    }

    // =====================================
    // XÁC THỰC CƯ DÂN
    // =====================================
    async function verifyResidentCard() {
        const userData = JSON.parse(localStorage.getItem('userData')) || {};
        const userId = userData.userId; // Lấy ID của người dùng đang đăng nhập
        const cardId = document.getElementById('inputCardId').value.trim();

        if (!userId) return showToast('error', 'Lỗi', 'Bạn chưa đăng nhập!');
        if (!cardId) return showToast('error', 'Thiếu thông tin', 'Vui lòng nhập mã thẻ cư dân hoặc CCCD!');

        const btn = document.getElementById('btnVerify');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
        btn.disabled = true;

        try {
            // GỌI API CÓ KÈM THEO USER ID TRÊN ĐƯỜNG DẪN
            const res = await fetch(`${API_BASE_URL}/verify-card/${userId}`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ cardUserId: cardId })
            });

            if (res.ok) {
                const verifiedUser = await res.json();

                // Lưu lại thông tin mới (lúc này isResident = true)
                localStorage.setItem('userData', JSON.stringify(verifiedUser));

                // Cập nhật giao diện
                updateDisplay(verifiedUser);
                showToast('success', 'Xác thực thành công', 'Bạn đã được nâng cấp quyền Cư dân Ecopark!');
            } else {
                const errMsg = await res.text();
                showToast('error', 'Xác thực thất bại', errMsg);
                btn.innerHTML = '<i class="fas fa-check-circle"></i> Xác thực ngay';
                btn.disabled = false;
            }
        } catch (error) {
            showToast('error', 'Lỗi mạng', 'Mất kết nối tới hệ thống xác thực.');
            btn.innerHTML = '<i class="fas fa-check-circle"></i> Xác thực ngay';
            btn.disabled = false;
        }
    }

    window.onload = loadInitialData;
</script>
</body>
</html>
