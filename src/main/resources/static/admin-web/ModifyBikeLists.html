<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ecopark Admin - Quản lý Xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-slate-100 p-6">
    <div class="max-w-6xl mx-auto">

        <!-- Header -->
        <div class="flex justify-between items-center mb-6 bg-white p-6 rounded-3xl shadow-sm">
            <div>
                <h1 class="text-2xl font-black uppercase text-slate-800">
                    Trạm: <span id="labelStation" class="text-green-600">Đang tải...</span>
                </h1>
                <div id="statusBadge" class="mt-2 text-xs font-bold px-3 py-1 rounded-full bg-gray-200 inline-block">
                    Đang tải DB...
                </div>
            </div>
            <button onclick="openModal('add')"
                class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold shadow-lg flex items-center gap-2 transition-all">
                <i class="fas fa-plus"></i> Thêm xe mới
            </button>
        </div>

        <!-- Tab trạm — load từ DB -->
        <div id="stationTabs" class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <span class="text-slate-400 text-sm font-bold py-2 px-4">Đang tải danh sách trạm...</span>
        </div>

        <!-- Bảng xe -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 text-slate-400 text-[10px] font-black uppercase tracking-widest border-b">
                    <tr>
                        <th class="px-8 py-4">Mã số (bikeCode)</th>
                        <th class="px-8 py-4">Loại (category)</th>
                        <th class="px-8 py-4">Trạng thái (status)</th>
                        <th class="px-8 py-4 text-right">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="bikeTableBody">
                    <tr><td colspan="4" class="text-center py-20 text-slate-400 font-bold">Đang tải dữ liệu từ MySQL...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal thêm/sửa xe -->
    <div id="bikeModal" class="modal fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 items-center justify-center">
        <div class="bg-white w-full max-w-md p-8 rounded-[40px] shadow-2xl">
            <h2 id="modalTitle" class="text-2xl font-black mb-6">Thêm xe mới</h2>
            <input type="hidden" id="editId">

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Mã xe</label>
                    <input type="text" id="inputCode" placeholder="VD: ECO-S-100"
                        class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none focus:ring-2 ring-blue-500">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Loại xe (categoryId)</label>
                    <select id="inputType" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
                        <option value="1">Xe đạp đơn (SINGLE)</option>
                        <option value="2">Xe đạp đôi (DOUBLE)</option>
                        <option value="3">Xe điện (ELECTRIC)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-1 block">Trạng thái</label>
                    <select id="inputStatus" class="w-full p-4 bg-slate-100 rounded-2xl font-bold outline-none">
                        <option value="AVAILABLE">Sẵn sàng (AVAILABLE)</option>
                        <option value="MAINTENANCE">Bảo trì (MAINTENANCE)</option>
                        <option value="IN_USE">Đang sử dụng (IN_USE)</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-8">
                <button onclick="closeModal()"
                    class="flex-1 py-4 font-bold text-slate-400 hover:text-slate-600 transition-colors">Hủy</button>
                <button onclick="handleSave()"
                    class="flex-1 py-4 bg-green-600 text-white rounded-2xl font-bold shadow-lg hover:bg-green-700 transition-colors">
                    LƯU DATABASE
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_STATIONS = 'http://localhost:8080/apiv1/admin/stations';
        const API_SEARCH   = 'http://localhost:8080/apiv1/search/stations';
        const API_VEHICLES = 'http://localhost:8080/apiv1/vehicles';

        let currentStationId = null;
        let currentBikes = [];

        function getToken() {
            return localStorage.getItem('accessToken') || localStorage.getItem('jwtToken') || '';
        }

        // ── 1. LOAD DANH SÁCH TRẠM TỪ DATABASE ──
        async function loadStations() {
            const tabsEl = document.getElementById('stationTabs');
            try {
                const res = await fetch(API_STATIONS);
                if (!res.ok) throw new Error('Lỗi load trạm');
                const stations = await res.json();

                if (!stations || stations.length === 0) {
                    tabsEl.innerHTML = '<span class="text-red-400 text-sm font-bold py-2 px-4">Chưa có trạm nào trong DB</span>';
                    return;
                }

                tabsEl.innerHTML = stations.map((s, i) => `
                    <button id="tab-${s.stationId}"
                        onclick="changeStation(this, ${s.stationId}, '${s.name}')"
                        class="station-btn px-6 py-2 rounded-xl font-bold transition-all ${i === 0 ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-500 hover:bg-slate-50'}">
                        ${s.name} (ID:${s.stationId})
                    </button>
                `).join('');

                // Tự động chọn trạm đầu tiên
                const first = stations[0];
                currentStationId = first.stationId;
                document.getElementById('labelStation').innerText = first.name;
                await loadBikes(first.stationId);

            } catch (err) {
                tabsEl.innerHTML = '<span class="text-red-400 text-sm font-bold py-2 px-4">❌ Không thể tải trạm từ DB</span>';
                setBadge(false);
            }
        }

        // ── 2. LOAD XE THEO TRẠM TỪ DATABASE ──
        async function loadBikes(stationId) {
            const tbody = document.getElementById('bikeTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-20 text-slate-400 font-bold">Đang tải...</td></tr>';
            try {
                const res = await fetch(`${API_SEARCH}/${stationId}`);
                if (!res.ok) throw new Error('Lỗi load xe');
                const data = await res.json();
                // StationDetailResponse: { station: {...}, bikes: [...] }
                currentBikes = data.bikes || [];
                setBadge(true);
                renderTable();
            } catch (err) {
                setBadge(false);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-16 text-red-400 font-bold">❌ Lỗi kết nối backend</td></tr>';
            }
        }

        // ── 3. VẼ BẢNG XE ──
        function renderTable() {
            const tbody = document.getElementById('bikeTableBody');
            if (!currentBikes || currentBikes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-20 text-slate-400 font-bold italic">Không có xe nào ở trạm này. Hãy thêm mới!</td></tr>';
                return;
            }
            tbody.innerHTML = currentBikes.map(b => {
                const statusColor = b.status === 'AVAILABLE' ? 'text-green-500'
                                  : b.status === 'MAINTENANCE' ? 'text-amber-500'
                                  : 'text-red-400';
                return `
                <tr class="border-b border-slate-50 hover:bg-slate-50 transition-colors">
                    <td class="px-8 py-5 font-bold text-slate-700">${b.bikeCode || '—'}</td>
                    <td class="px-8 py-5 text-xs font-bold text-slate-500">${b.category || '—'}</td>
                    <td class="px-8 py-5 text-xs font-bold ${statusColor}">${b.status || '—'}</td>
                    <td class="px-8 py-5 text-right">
                        <button onclick="openModal('edit', ${b.bikeId})"
                            class="text-blue-400 hover:text-blue-600 p-2 transition-colors">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteBike(${b.bikeId})"
                            class="text-red-300 hover:text-red-500 p-2 transition-colors">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            }).join('');
        }

        // ── 4. CHUYỂN TRẠM ──
        function changeStation(btn, id, name) {
            currentStationId = id;
            document.getElementById('labelStation').innerText = name;
            document.querySelectorAll('.station-btn').forEach(b => {
                b.className = 'station-btn px-6 py-2 rounded-xl font-bold bg-white text-slate-500 hover:bg-slate-50 transition-all';
            });
            btn.className = 'station-btn px-6 py-2 rounded-xl font-bold bg-slate-800 text-white shadow-md transition-all';
            loadBikes(id);
        }

        // ── 5. THÊM / SỬA XE ──
        async function handleSave() {
            const id        = document.getElementById('editId').value;
            const bikeCode  = document.getElementById('inputCode').value.trim();
            const categoryId = parseInt(document.getElementById('inputType').value);
            const status    = document.getElementById('inputStatus').value;

            if (!bikeCode) { alert('Vui lòng nhập mã xe!'); return; }
            if (!currentStationId) { alert('Chưa chọn trạm!'); return; }

            const token = getToken();
            if (!token) { alert('Bạn chưa đăng nhập!'); return; }

            // Payload khớp với BikeDTO.CreateRequest / UpdateRequest
            const payload = { bikeCode, categoryId, stationId: currentStationId };

            try {
                const url    = id ? `${API_VEHICLES}/${id}` : API_VEHICLES;
                const method = id ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeModal();
                    await loadBikes(currentStationId);
                    alert(id ? 'Cập nhật xe thành công!' : 'Thêm xe mới thành công!');
                } else {
                    alert('Lưu thất bại: ' + await res.text());
                }
            } catch (err) {
                alert('Lỗi kết nối Server!');
            }
        }

        // ── 6. XÓA XE ──
        async function deleteBike(id) {
            if (!confirm('Bạn có chắc chắn muốn xóa xe này?')) return;
            const token = getToken();
            if (!token) { alert('Bạn chưa đăng nhập!'); return; }
            try {
                const res = await fetch(`${API_VEHICLES}/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    await loadBikes(currentStationId);
                    alert('Đã xóa xe thành công!');
                } else {
                    alert('Xóa thất bại: ' + await res.text());
                }
            } catch (err) {
                alert('Lỗi kết nối Server!');
            }
        }

        // ── 7. MODAL ──
        function openModal(mode, bikeId = null) {
            document.getElementById('bikeModal').classList.add('active');
            document.getElementById('editId').value = bikeId || '';
            if (mode === 'edit' && bikeId) {
                const b = currentBikes.find(x => x.bikeId === bikeId);
                document.getElementById('modalTitle').innerText = 'Cập nhật xe';
                document.getElementById('inputCode').value   = b?.bikeCode || '';
                document.getElementById('inputStatus').value = b?.status   || 'AVAILABLE';
                // categoryId: mapping từ tên category
                const catMap = { 'SINGLE': '1', 'DOUBLE': '2', 'ELECTRIC': '3' };
                document.getElementById('inputType').value = catMap[b?.category] || '1';
            } else {
                document.getElementById('modalTitle').innerText = 'Thêm xe mới';
                document.getElementById('inputCode').value   = '';
                document.getElementById('inputStatus').value = 'AVAILABLE';
                document.getElementById('inputType').value   = '1';
            }
        }

        function closeModal() {
            document.getElementById('bikeModal').classList.remove('active');
        }

        function setBadge(ok) {
            const badge = document.getElementById('statusBadge');
            if (ok) {
                badge.innerText   = '● ĐÃ KẾT NỐI DATABASE';
                badge.className   = 'mt-2 text-[10px] font-black px-3 py-1 rounded-full bg-green-100 text-green-600 inline-block';
            } else {
                badge.innerText   = '● LỖI KẾT NỐI BACKEND';
                badge.className   = 'mt-2 text-[10px] font-black px-3 py-1 rounded-full bg-red-100 text-red-600 inline-block';
            }
        }

        // Khởi động
        window.onload = loadStations;
    </script>
</body>
</html>
