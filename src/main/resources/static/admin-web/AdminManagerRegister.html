<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark Bike Rental - Admin & Manager Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-gradient-custom {
            background: radial-gradient(circle at 10% 10%, #f0fdf4 0%, #ffffff 50%);
        }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen flex items-center justify-center p-4">

    <div class="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
        
        <div class="flex flex-col items-center text-center space-y-6">
            <div class="w-16 h-16 bg-[#10b981] rounded-full flex items-center justify-center text-white text-3xl shadow-lg">
                <i class="fas fa-user-shield"></i>
            </div>
            
            <div class="space-y-2">
                <h1 class="text-4xl font-bold text-slate-800">Quản Trị Hệ Thống</h1>
                <p class="text-gray-500 max-w-sm mx-auto">Dành cho Quản trị viên (Admin) và Quản lý (Manager) Ecopark Bike Rental</p>
            </div>

            <div class="relative w-full max-w-md">
                <img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&q=80&w=1000" 
                     alt="Admin Panel" 
                     class="rounded-2xl shadow-2xl border-4 border-white object-cover h-64 w-full">
            </div>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-50 max-w-md w-full mx-auto">
            
            <div class="flex bg-gray-100 p-1 rounded-xl mb-8">
                <button id="tabLogin" onclick="showForm('login')" class="flex-1 py-2 text-sm font-medium rounded-lg bg-white shadow-sm text-slate-800 transition-all">Đăng nhập</button>
                <button id="tabRegister" onclick="showForm('register')" class="flex-1 py-2 text-sm font-medium text-gray-500 hover:text-slate-800 transition-all">Đăng ký mới</button>
            </div>

            <!-- Form Đăng nhập -->
            <div id="formLogin" class="space-y-6">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Đăng nhập Quản trị</h2>
                    <p class="text-sm text-gray-400 mt-1">Truy cập hệ thống quản lý phương tiện</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Email công việc</label>
                        <div class="relative mt-1">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <i class="far fa-envelope"></i>
                            </span>
                            <input type="email" id="loginEmail" placeholder="admin@ecopark.com" 
                                   class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Mật khẩu</label>
                        <div class="relative mt-1">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                <i class="fas fa-lock text-sm"></i>
                            </span>
                            <input type="password" id="loginPass" placeholder="••••••••" 
                                   class="w-full pl-10 pr-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                        </div>
                    </div>
                    <button type="button" onclick="handleLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-all shadow-lg mt-4">
                        Xác nhận đăng nhập
                    </button>
                </div>
            </div>

            <!-- Form Đăng ký Manager mới -->
            <div id="formRegister" class="space-y-6 hidden">
                <div>
                    <h2 class="text-2xl font-bold text-slate-800">Cấp tài khoản mới</h2>
                    <p class="text-sm text-gray-400 mt-1">Tạo thông tin định danh cho nhân sự quản lý</p>
                </div>

                <div class="space-y-4 max-h-[400px] overflow-y-auto pr-2">
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Tên nhân sự</label>
                        <input type="text" id="regFullName" placeholder="Nguyễn Quản Lý" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Email hệ thống</label>
                        <input type="email" id="regEmail" placeholder="manager.name@ecopark.com" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Số điện thoại</label>
                        <input type="tel" id="regPhone" placeholder="0987654321" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Mã định danh (CCCD)</label>
                        <input type="text" id="regNationalId" placeholder="001234567890" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <div>
                        <label class="text-sm font-semibold text-slate-700">Mật khẩu bảo mật</label>
                        <input type="password" id="regPass" placeholder="••••••••" class="w-full px-4 py-3 bg-gray-50 border border-gray-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                    <button type="button" onclick="handleRegister()" class="w-full bg-[#10b981] hover:bg-[#0da472] text-white font-bold py-3 rounded-xl transition-all shadow-lg mt-4">
                        Tạo tài khoản quản lý
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:8080/apiv1/auth";

        function showForm(type) {
            const loginForm = document.getElementById('formLogin');
            const registerForm = document.getElementById('formRegister');
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLogin.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                tabLogin.classList.remove('text-gray-500');
                tabRegister.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                tabRegister.classList.add('text-gray-500');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegister.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                tabRegister.classList.remove('text-gray-500');
                tabLogin.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                tabLogin.classList.add('text-gray-500');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;

            if (!email || !password) {
                alert("Vui lòng nhập đầy đủ thông tin!");
                return;
            }

            const btn = document.querySelector('#formLogin button[onclick="handleLogin()"]');
            btn.textContent = 'Đang xác thực...';
            btn.disabled = true;

            try {
                const response = await fetch(`${BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    const role = data.user.role;

                    // Chỉ cho ADMIN và MANAGER vào, chặn CUSTOMER
                    if (role !== 'ADMIN' && role !== 'MANAGER') {
                        alert("Tài khoản này không có quyền truy cập trang quản trị!\nVui lòng dùng tài khoản ADMIN hoặc MANAGER.");
                        btn.textContent = 'Xác nhận đăng nhập';
                        btn.disabled = false;
                        return;
                    }

                    localStorage.setItem('accessToken', data.accessToken);
                    localStorage.setItem('jwtToken', data.accessToken);
                    localStorage.setItem('userRole', role);
                    localStorage.setItem('userData', JSON.stringify(data.user));

                    if (role === 'ADMIN') {
                        window.location.href = 'AdminPage.html';
                    } else {
                        window.location.href = '../manager-web/DashboardManager.html';
                    }
                } else {
                    const msg = typeof data === 'string' ? data : (data.message || 'Sai thông tin tài khoản!');
                    alert("Đăng nhập thất bại: " + msg);
                    btn.textContent = 'Xác nhận đăng nhập';
                    btn.disabled = false;
                }
            } catch (error) {
                alert("Lỗi kết nối Server!\nHãy kiểm tra Backend đã chạy ở cổng 8080 chưa.");
                btn.textContent = 'Xác nhận đăng nhập';
                btn.disabled = false;
            }
        }

        async function handleRegister() {
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const nationalId = document.getElementById('regNationalId').value.trim();
            const password = document.getElementById('regPass').value;

            if (!fullName || !email || !password) {
                alert("Vui lòng điền đủ: Tên, Email và Mật khẩu!");
                return;
            }
            if (password.length < 6) {
                alert("Mật khẩu phải có ít nhất 6 ký tự!");
                return;
            }

            const btn = document.querySelector('#formRegister button[onclick="handleRegister()"]');
            btn.textContent = 'Đang tạo...';
            btn.disabled = true;

            const registerData = {
                username: email,
                password: password,
                fullName: fullName,
                email: email,
                nationalId: nationalId || null,
                phoneNumber: phone || null
            };

            try {
                // Gọi endpoint /create-manager (tạo tài khoản với role MANAGER thẳng)
                let response = await fetch(`${BASE_URL}/create-manager`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(registerData)
                });

                // Fallback về /register nếu endpoint chưa có
                if (response.status === 404 || response.status === 405) {
                    response = await fetch(`${BASE_URL}/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(registerData)
                    });
                    if (response.ok) {
                        alert("Tạo tài khoản thành công!\n\n⚠ LƯU Ý: Role hiện tại là CUSTOMER.\nVào phpMyAdmin → bảng users → đổi role = 'MANAGER' cho email: " + email);
                        showForm('login');
                    } else {
                        const err = await response.text();
                        alert("Lỗi: " + err);
                    }
                } else if (response.ok) {
                    alert("Tạo tài khoản Manager thành công!\nEmail: " + email + "\nCó thể đăng nhập ngay.");
                    showForm('login');
                } else {
                    const err = await response.text();
                    alert("Lỗi: " + err);
                }
            } catch (error) {
                alert("Không thể kết nối Server!");
            } finally {
                btn.textContent = 'Tạo tài khoản quản lý';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
