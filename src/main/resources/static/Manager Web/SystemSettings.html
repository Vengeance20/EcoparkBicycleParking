<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark Admin - System Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .admin-badge { 
            background: #ef4444; color: white; font-size: 8px; padding: 2px 8px; 
            border-radius: 4px; font-weight: 900; margin-left: 8px;
        }

        .locked-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 60px 20px; text-align: center; background: #fff1f2;
            border: 2px dashed #fecaca; border-radius: 35px;
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <button onclick="window.history.back()" class="group mb-6 text-gray-400 hover:text-[#00a859] font-bold text-sm flex items-center gap-2 transition-all">
            <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:bg-green-50 transition-all">
                <i class="fas fa-chevron-left text-[10px]"></i>
            </div>
            QUAY LẠI
        </button>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Cấu hình hệ thống</h1>
                <p class="text-xs text-gray-400 mt-1 font-bold uppercase tracking-widest flex items-center gap-2" id="roleIndicator">
                    <i class="fas fa-sync fa-spin"></i> Đang xác thực quyền hạn...
                </p>
            </div>
            <div id="debugRole" class="text-[10px] text-gray-300 font-bold uppercase tracking-widest border-l-2 border-gray-200 pl-4">Security: Ecopark v2.0</div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-2" id="sidebarMenu">
                <button onclick="showTab('hours')" class="tab-btn w-full text-left p-4 rounded-2xl bg-[#00a859] text-white font-bold shadow-lg transition-all" id="btn-hours">
                    <i class="fas fa-clock mr-3 w-5"></i> Giờ hoạt động
                </button>
                <button onclick="showTab('price')" class="tab-btn admin-only w-full text-left p-4 rounded-2xl bg-white text-slate-500 font-bold hover:bg-gray-50 transition-all" id="btn-price">
                    <i class="fas fa-gas-pump mr-3 w-5"></i> Cấu hình giá <span class="admin-badge">ADMIN</span>
                </button>
                <button onclick="showTab('roles')" class="tab-btn admin-only w-full text-left p-4 rounded-2xl bg-white text-slate-500 font-bold hover:bg-gray-50 transition-all" id="btn-roles">
                    <i class="fas fa-users-cog mr-3 w-5"></i> Phân quyền <span class="admin-badge">ADMIN</span>
                </button>
                <button onclick="showTab('danger')" class="tab-btn admin-only w-full text-left p-4 rounded-2xl bg-white text-red-400 font-bold hover:bg-red-50 transition-all" id="btn-danger">
                    <i class="fas fa-radiation mr-3 w-5"></i> Vùng nguy hiểm <span class="admin-badge">ADMIN</span>
                </button>
            </div>

            <div class="lg:col-span-3">
                <div id="tab-hours" class="tab-content active bg-white p-8 rounded-[35px] shadow-sm border border-gray-100">
                    <h3 class="text-sm font-black text-slate-800 uppercase mb-6">Thời gian hoạt động trạm</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <span class="font-bold text-slate-700">Mở cửa</span>
                            <input type="time" value="06:00" class="bg-white px-4 py-2 rounded-xl border border-gray-200 font-bold outline-none">
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <span class="font-bold text-slate-700">Đóng cửa</span>
                            <input type="time" value="22:00" class="bg-white px-4 py-2 rounded-xl border border-gray-200 font-bold outline-none">
                        </div>
                    </div>
                </div>

                <div id="tab-price" class="tab-content bg-white p-8 rounded-[35px] shadow-sm border-2 border-red-50">
                    <div class="admin-secure-zone">
                        <h3 class="text-sm font-black text-red-600 uppercase mb-6"><i class="fas fa-lock mr-2"></i> Bảng giá xe (Admin Only)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-gray-400 uppercase">Xe đơn (VNĐ/giờ)</label>
                                <input type="text" value="10,000" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-transparent focus:border-red-500 outline-none font-bold">
                            </div>
                            <div class="space-y-2">
                                <label class="text-[10px] font-black text-gray-400 uppercase">Xe đôi (VNĐ/giờ)</label>
                                <input type="text" value="20,000" class="w-full bg-gray-50 p-4 rounded-2xl border-2 border-transparent focus:border-red-500 outline-none font-bold">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-roles" class="tab-content bg-white p-8 rounded-[35px] shadow-sm border-2 border-red-50">
                    <div class="admin-secure-zone">
                        <h3 class="text-sm font-black text-red-600 uppercase mb-6">Quản lý tài khoản</h3>
                        <div class="p-8 border border-dashed border-red-200 rounded-2xl text-center bg-red-50/30">
                            <p class="text-xs text-gray-400 font-black italic uppercase">Dữ liệu bảo mật tối cao</p>
                            <p class="text-[10px] text-red-400 mt-1">Đang kết nối database nhân sự...</p>
                        </div>
                    </div>
                </div>

                <div id="tab-danger" class="tab-content bg-white p-8 rounded-[40px] shadow-sm border-2 border-red-100">
                    <div class="admin-secure-zone text-center space-y-4">
                        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-2xl mx-auto shadow-inner">
                            <i class="fas fa-radiation"></i>
                        </div>
                        <h3 class="text-lg font-black text-red-600 uppercase">Reset Hệ Thống</h3>
                        <button class="w-full py-4 bg-red-600 text-white rounded-2xl font-black text-xs shadow-lg hover:bg-red-700 transition-all">XÁC NHẬN XÓA DỮ LIỆU TẠM THỜI</button>
                    </div>
                </div>

                <button id="saveBtn" onclick="saveChanges()" class="mt-8 w-full bg-slate-900 text-white py-5 rounded-[25px] font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                    LƯU CẤU HÌNH <i class="fas fa-check-circle text-green-400"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        let GLOBAL_ROLE = 'MANAGER';

        function autoDetectRole() {
            // 1. Lấy tham số từ URL (?role=ADMIN)
            const urlParams = new URLSearchParams(window.location.search);
            const roleParam = urlParams.get('role');
            
            // 2. Lấy trang nguồn (referrer)
            const referrer = document.referrer;
            const indicator = document.getElementById('roleIndicator');

            // KIỂM TRA: Nếu có tham số ADMIN hoặc đến từ trang AdminPage.html
            if (roleParam === 'ADMIN' || referrer.includes('AdminPage.html')) {
                GLOBAL_ROLE = 'ADMIN';
                indicator.innerHTML = '<i class="fas fa-user-shield text-red-500"></i> Quyền hạn: ADMIN (Toàn quyền)';
                indicator.className = "text-xs text-red-600 mt-1 font-black uppercase tracking-widest flex items-center gap-2";
                console.log("Xác thực: Admin tối cao.");
            } 
            else {
                GLOBAL_ROLE = 'MANAGER';
                indicator.innerHTML = '<i class="fas fa-user-tie text-[#00a859]"></i> Quyền hạn: MANAGER (Hạn chế)';
                applyManagerLock();
                console.log("Xác thực: Manager.");
            }
        }

        function applyManagerLock() {
            // Ẩn nút tab admin ở sidebar
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');

            // Khóa nội dung bên trong các tab nhạy cảm
            document.querySelectorAll('.admin-secure-zone').forEach(zone => {
                zone.innerHTML = `
                    <div class="locked-screen">
                        <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-4">
                            <i class="fas fa-lock text-xl"></i>
                        </div>
                        <h2 class="text-lg font-black text-red-600 uppercase">Khu vực bị khóa</h2>
                        <p class="text-[10px] text-gray-400 font-bold mt-2 uppercase tracking-tighter">Bạn cần quyền Admin để thay đổi các thông số này.</p>
                    </div>`;
            });

            // Vô hiệu hóa nút lưu
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = 'CHỈ XEM (QUYỀN MANAGER)';
            saveBtn.className = "mt-8 w-full bg-gray-200 text-gray-400 py-5 rounded-[25px] font-bold cursor-not-allowed";
            saveBtn.disabled = true;
        }

        function showTab(tabId) {
            // Chặn Manager bấm vào các tab Admin
            if (GLOBAL_ROLE === 'MANAGER' && ['price', 'roles', 'danger'].includes(tabId)) {
                alert("⚠ Truy cập bị từ chối: Manager không có quyền sửa đổi mục này.");
                return;
            }

            // Chuyển Tab
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-[#00a859]', 'text-white', 'shadow-lg');
                b.classList.add('bg-white', 'text-slate-500');
            });

            document.getElementById('tab-' + tabId).classList.add('active');
            const btn = document.getElementById('btn-' + tabId);
            btn.classList.add('bg-[#00a859]', 'text-white', 'shadow-lg');
            btn.classList.remove('bg-white', 'text-slate-500');
        }

        function saveChanges() {
            if(GLOBAL_ROLE === 'ADMIN') {
                alert("Hệ thống: Đã ghi nhận thay đổi từ Admin!");
            }
        }

        window.onload = autoDetectRole;
    </script>
</body>
</html>
