<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark Bike - Thuê Xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bike-card { transition: all 0.3s ease; }
        .renting-active { border: 2px solid #10b981; background: #f0fdf4; }
    </style>
</head>
<body class="bg-slate-50">

    <nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-50">
        <span class="text-xl font-bold text-green-600">ECOPARK BIKE</span>
        <div id="status-bar" class="text-[10px] font-bold text-slate-400">ĐANG KẾT NỐI...</div>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <div id="bike-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <script>
        let allBikes = [];
        let activeRentals = {}; 
        const API_URL = 'http://localhost:8080/api/v1/bicycles';

        async function loadBikes() {
            try {
                const res = await fetch(API_URL);
                allBikes = await res.json();
                document.getElementById('status-bar').innerText = "HỆ THỐNG ONLINE";
                render();
            } catch (e) {
                document.getElementById('status-bar').innerText = "LỖI KẾT NỐI";
            }
        }

        async function toggleRental(id) {
            // Tìm xe dựa trên thuộc tính bike_id từ Backend
            const bike = allBikes.find(b => b.bike_id == id);
            if (!bike) return;

            if (activeRentals[id]) {
                if (confirm("Bạn muốn trả xe?")) {
                    bike.status = 'AVAILABLE';
                    const res = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(bike)
                    });
                    if (res.ok) {
                        clearInterval(activeRentals[id].interval);
                        delete activeRentals[id];
                        loadBikes();
                    }
                }
            } else {
                if (confirm(`Thuê xe ${bike.bikeCode || bike.bike_code}?`)) {
                    bike.status = 'IN_USE'; // Trạng thái đang dùng
                    const res = await fetch(`${API_URL}/${id}`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(bike)
                    });
                    if (res.ok) {
                        activeRentals[id] = {
                            start: Date.now(),
                            interval: setInterval(() => updateTimer(id), 1000)
                        };
                        render();
                    }
                }
            }
        }

        function updateTimer(id) {
            const diff = Date.now() - activeRentals[id].start;
            const s = Math.floor((diff / 1000) % 60);
            const m = Math.floor((diff / 60000) % 60);
            const el = document.getElementById(`timer-${id}`);
            if (el) el.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        }

        function render() {
            const grid = document.getElementById('bike-grid');
            grid.innerHTML = allBikes.map(bike => {
                // Khớp với tên biến trong Bicycle.java
                const id = bike.bike_id; 
                const code = bike.bikeCode || bike.bike_code; 
                const type = bike.bikeType || bike.bike_type;
                const status = bike.status;
                
                const isRunning = !!activeRentals[id];
                const available = status === 'AVAILABLE';

                return `
                <div class="bike-card bg-white p-5 rounded-3xl shadow-sm border ${isRunning ? 'renting-active' : ''}">
                    <div class="flex justify-between text-[10px] font-bold mb-4">
                        <span class="text-slate-400">ID: ${id}</span>
                        <span class="${available ? 'text-green-500' : 'text-red-500'}">${isRunning ? 'ĐANG ĐI' : status}</span>
                    </div>
                    
                    <div class="text-center py-4">
                        ${isRunning ? 
                            `<div id="timer-${id}" class="text-3xl font-mono font-black text-slate-700">00:00</div>` : 
                            `<h3 class="text-2xl font-black text-slate-800">${code}</h3>`
                        }
                        <p class="text-[10px] text-slate-400 mt-2 uppercase">${type}</p>
                    </div>

                    <button onclick="toggleRental(${id})" 
                        ${(!available && !isRunning) ? 'disabled' : ''}
                        class="w-full mt-4 py-3 rounded-xl font-bold text-xs uppercase tracking-widest transition-all
                        ${isRunning ? 'bg-red-500 text-white' : (available ? 'bg-slate-900 text-white hover:bg-green-600' : 'bg-slate-200 text-slate-400')}">
                        ${isRunning ? 'Trả xe' : (available ? 'Thuê xe' : 'Bận')}
                    </button>
                </div>`;
            }).join('');
        }

        window.onload = loadBikes;
    </script>
</body>
</html>
