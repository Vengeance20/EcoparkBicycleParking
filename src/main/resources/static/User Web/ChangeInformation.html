<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark - Thông tin cá nhân</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
        input:focus { outline: none; border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }
        #toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            padding: 16px 32px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); transition: all 0.5s ease; opacity: 0; z-index: 1000; max-width: 90vw;
        }
        #toast.show { bottom: 40px; opacity: 1; }
        .toast-success { background: #1e293b; color: white; }
        .toast-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .toast-info { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- HEADER -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2 text-green-600 font-bold text-xl">
            <i class="fas fa-bicycle"></i>
            <span>ECOPARK BIKES</span>
        </div>
        <button onclick="logout()" class="text-red-500 font-bold text-sm hover:text-red-700 transition-all">
            <i class="fas fa-sign-out-alt mr-1"></i> Đăng xuất
        </button>
    </nav>

    <!-- MAIN PROFILE LAYOUT -->
    <main class="max-w-5xl mx-auto p-6 mt-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- CỘT TRÁI: THẺ AVATAR & THÔNG TIN -->
            <div class="space-y-6">
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 flex flex-col items-center text-center">
                    <div class="w-28 h-28 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 text-white flex items-center justify-center text-5xl font-bold shadow-lg mb-4 border-4 border-white" id="bigAvatar">?</div>
                    <h2 class="text-xl font-black text-slate-800" id="displayName">Người dùng mới</h2>
                    <p class="text-sm text-slate-400 mt-1 uppercase font-bold" id="displayRole">CUSTOMER</p>
                    
                    <div class="mt-6 w-full space-y-3 text-left text-sm">
                        <div class="flex items-center gap-3 text-slate-600">
                            <i class="fas fa-envelope w-5 text-slate-400"></i>
                            <span id="displayEmail" class="truncate">Chưa cập nhật</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-600">
                            <i class="fas fa-phone w-5 text-slate-400"></i>
                            <span id="displayPhone">Chưa cập nhật</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-600">
                            <i class="fas fa-id-card w-5 text-slate-400"></i>
                            <span id="displayNationalId">Chưa cập nhật</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CỘT PHẢI: FORM XEM CHỈNH SỬA -->
            <div class="md:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-100 p-8">
                <h3 class="font-bold text-lg border-l-4 border-green-500 pl-3 mb-6 uppercase tracking-wide text-slate-800">Thông tin cá nhân</h3>
                
                <div class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-user mr-1"></i> Họ và tên</label>
                        <input type="text" id="inputFullName" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold transition-all" placeholder="Nhập họ và tên của bạn">
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-phone mr-1"></i> Số điện thoại</label>
                            <input type="tel" id="inputPhoneNumber" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold transition-all" placeholder="Nhập SĐT">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-id-card mr-1"></i> Căn cước công dân</label>
                            <input type="text" id="inputNationalId" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold transition-all" placeholder="Nhập CCCD">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-400 uppercase mb-2"><i class="fas fa-envelope mr-1"></i> Email</label>
                        <input type="email" id="inputEmail" class="w-full bg-gray-50 border border-gray-100 rounded-xl p-3.5 font-bold transition-all" placeholder="Nhập Email">
                    </div>
                </div>

                <button onclick="saveProfile()" id="btnSave" class="w-full mt-8 bg-green-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-600 transition-all uppercase tracking-widest text-sm flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i> Lưu thông tin
                </button>
            </div>
        </div>
    </main>

    <div id="toast">
        <div id="toastIcon" class="w-10 h-10 rounded-full flex items-center justify-center"><i id="faIcon" class="fas"></i></div>
        <div>
            <p id="toastTitle" class="font-bold"></p>
            <p id="toastDesc" class="text-xs opacity-80"></p>
        </div>
    </div>

<script>
    const API_BASE_URL = "http://localhost:8080/apiv1/auth";
    let initialData = {}; 

    function showToast(type, title, desc) {
        const toast = document.getElementById('toast');
        toast.className = `show ${type === 'success' ? 'toast-success' : (type === 'info' ? 'toast-info' : 'toast-error')}`;
        document.getElementById('toastIcon').className = `w-10 h-10 rounded-full flex items-center justify-center ${type === 'success' ? 'bg-green-500 text-white' : (type === 'info' ? 'bg-yellow-500 text-white' : 'bg-red-500 text-white')}`;
        document.getElementById('faIcon').className = `fas ${type === 'success' ? 'fa-check' : (type === 'info' ? 'fa-info-circle' : 'fa-exclamation-triangle')}`;
        document.getElementById('toastTitle').innerText = title;
        document.getElementById('toastDesc').innerText = desc;
        setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    function logout() {
        localStorage.removeItem('userData');
        localStorage.removeItem('token');
        // Đường dẫn quay về trang login (do file này nằm trong thư mục User Web)
        window.location.href = '../RegisterLoginPage.html'; 
    }

    function updateDisplay(user) {
        const fullName = user.fullName || 'Người dùng mới';
        document.getElementById('displayName').innerText = fullName;
        document.getElementById('displayEmail').innerText = user.email || 'Chưa cập nhật';
        document.getElementById('displayPhone').innerText = user.phoneNumber || 'Chưa cập nhật';
        document.getElementById('displayNationalId').innerText = user.nationalId || 'Chưa cập nhật';
        document.getElementById('displayRole').innerText = user.role || 'CUSTOMER';
        
        const avatarLetter = fullName !== 'Người dùng mới' ? fullName.charAt(0).toUpperCase() : '?';
        document.getElementById('bigAvatar').innerText = avatarLetter;
    }

    function loadInitialData() {
        const userData = JSON.parse(localStorage.getItem('userData')) || {};
        
        if (!userData.userId) {
            showToast('error', 'Lỗi', 'Bạn chưa đăng nhập!');
            setTimeout(() => { 
                window.location.href = '../RegisterLoginPage.html'; 
            }, 2000);
            return;
        }

        initialData = {
            fullName: userData.fullName || '',
            phoneNumber: userData.phoneNumber || '',
            email: userData.email || '',
            nationalId: userData.nationalId || ''
        };

        document.getElementById('inputFullName').value = initialData.fullName;
        document.getElementById('inputPhoneNumber').value = initialData.phoneNumber;
        document.getElementById('inputEmail').value = initialData.email;
        document.getElementById('inputNationalId').value = initialData.nationalId;

        updateDisplay(userData);
    }

    async function saveProfile() {
        const userData = JSON.parse(localStorage.getItem('userData')) || {};
        const userId = userData.userId;
        if (!userId) return;

        const currentData = {
            fullName: document.getElementById('inputFullName').value,
            phoneNumber: document.getElementById('inputPhoneNumber').value,
            email: document.getElementById('inputEmail').value,
            nationalId: document.getElementById('inputNationalId').value
        };

        if (currentData.fullName === initialData.fullName && 
            currentData.phoneNumber === initialData.phoneNumber && 
            currentData.email === initialData.email && 
            currentData.nationalId === initialData.nationalId) {
            
            showToast('info', 'Không có thay đổi', 'Bạn chưa thay đổi thông tin nào để lưu.');
            return; 
        }

        const btn = document.getElementById('btnSave');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang lưu...';
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE_URL}/update-profile/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(currentData)
            });

            if (res.ok) {
                const updatedUser = await res.json(); 
                
                localStorage.setItem('userData', JSON.stringify(updatedUser));
                
                initialData = {
                    fullName: updatedUser.fullName || '',
                    phoneNumber: updatedUser.phoneNumber || '',
                    email: updatedUser.email || '',
                    nationalId: updatedUser.nationalId || ''
                };

                updateDisplay(updatedUser);
                
                showToast('success', 'Cập nhật thành công', 'Đã lưu vào Database!');
            } else {
                const errMsg = await res.text();
                showToast('error', 'Cập nhật thất bại', errMsg);
            }
        } catch (error) {
            showToast('error', 'Lỗi kết nối', 'Không thể kết nối đến server.');
        } finally {
            btn.innerHTML = '<i class="fas fa-save"></i> Lưu thông tin';
            btn.disabled = false;
        }
    }

    window.onload = loadInitialData;
</script>
</body>
</html>
