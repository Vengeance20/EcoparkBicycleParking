<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark - Tìm trạm xe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Thư viện Bản đồ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { background: #f8fafc; font-family: 'Segoe UI', sans-serif; margin: 0; }
        #map { height: 50vh; width: 100%; z-index: 0; }
        .station-card { transition: all 0.3s ease; border: 1px solid #e2e8f0; }
        .station-card:hover { transform: translateY(-3px); border-color: #10b981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.1); }
        
        /* Marker Icon CSS */
        .custom-marker {
            background: #10b981; color: white; font-weight: 900; border-radius: 50%; 
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            border: 3px solid white; box-shadow: 0 3px 10px rgba(0,0,0,0.3); font-size: 12px;
        }
        .custom-marker.maintenance { background: #f59e0b; }

        /* Modal CSS */
        #bikeModal {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateY(100%);
        }
        #bikeModal.active { transform: translateY(0); }
        #overlay { transition: opacity 0.3s ease; }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER & SEARCH -->
    <div class="bg-emerald-600 p-6 pb-10 rounded-b-[3rem] shadow-xl relative z-10">
        <h1 class="text-white text-2xl font-black mb-5 flex items-center gap-3">
            <i class="fas fa-map-marked-alt"></i> TÌM TRẠM XE
        </h1>
        <div class="relative group">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" 
                placeholder="Tìm tên trạm..." 
                class="w-full pl-14 pr-6 py-4 rounded-2xl border-none focus:ring-4 focus:ring-emerald-200 shadow-lg text-base outline-none">
        </div>
    </div>

    <!-- BẢN ĐỒ & NÚT GPS -->
    <div class="relative mx-4 -mt-6 rounded-3xl overflow-hidden shadow-lg border-2 border-white z-20">
        <div id="map"></div>
        <button onclick="locateMe()" class="absolute top-4 right-4 bg-white p-3 rounded-xl shadow-lg hover:bg-emerald-50 transition-all z-[1000]">
            <i class="fas fa-crosshairs text-emerald-600 text-lg"></i>
        </button>
    </div>

    <!-- DANH SÁCH TRẠM -->
    <div class="px-6 py-4 flex justify-between items-center mt-4">
        <p class="text-slate-500 font-bold text-sm" id="resultCount">Đang tải...</p>
        <button onclick="fetchData()" class="text-emerald-600 font-bold text-sm hover:underline">
            <i class="fas fa-sync-alt mr-1"></i> Làm mới
        </button>
    </div>

    <div id="stationContainer" class="px-6 space-y-4"></div>

    <!-- OVERLAY & MODAL XEM XE TẠI TRẠM -->
    <div id="overlay" class="fixed inset-0 bg-black/40 z-[2000] hidden opacity-0" onclick="closeModal()"></div>
    <div id="bikeModal" class="fixed bottom-0 left-0 right-0 bg-white rounded-t-[3rem] p-6 z-[2001] max-h-[70vh] overflow-y-auto shadow-2xl">
        <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6"></div>
        <div class="flex justify-between items-center mb-6">
            <h2 id="modalTitle" class="text-xl font-black text-slate-800 uppercase">Xe tại trạm</h2>
            <button onclick="closeModal()" class="text-slate-400 hover:text-red-500 text-2xl leading-none">&times;</button>
        </div>
        <div id="bikeListContainer" class="space-y-3"></div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-100 px-8 py-3 flex justify-between items-center z-50">
        <button onclick="location.href='/HomePage.html'" class="flex flex-col items-center text-slate-400 hover:text-emerald-500 transition-colors">
            <i class="fas fa-home text-xl"></i><span class="text-[10px] mt-1 font-bold">Trang chủ</span>
        </button>
        <button class="flex flex-col items-center text-emerald-600">
            <i class="fas fa-compass text-xl"></i><span class="text-[10px] mt-1 font-bold">Tìm trạm</span>
        </button>
        <button onclick="location.href='/ProfilePage.html'" class="flex flex-col items-center text-slate-400 hover:text-emerald-500 transition-colors">
            <i class="fas fa-user-circle text-xl"></i><span class="text-[10px] mt-1 font-bold">Cá nhân</span>
        </button>
    </nav>

    <script>
        const API_BASE = "http://localhost:8080/apiv1";
        let stationsData = [];
        let bikesData = []; // Lưu trữ danh sách xe
        let map;

        function initMap() {
            map = L.map('map').setView([21.008, 105.864], 14);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        }

        // ==========================================
        // 1. FETCH CẢ TRẠM VÀ XE ĐỒNG THỜI
        // ==========================================
        async function fetchData() {
            const container = document.getElementById('stationContainer');
            const countDisplay = document.getElementById('resultCount');
            container.innerHTML = `<div class="flex flex-col items-center justify-center py-10 text-slate-400"><div class="animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent mb-4"></div><p class="font-medium text-sm">Đang tải dữ liệu...</p></div>`;

            try {
                // Gọi song song 2 API để tăng tốc độ tải trang
                const [stationsRes, bikesRes] = await Promise.all([
                    fetch(`${API_BASE}/search/stations`),
                    fetch(`${API_BASE}/vehicles/public`)
                ]);

                if (!stationsRes.ok) throw new Error('Lỗi tải trạm');

                stationsData = await stationsRes.json();
                if (bikesRes.ok) bikesData = await bikesRes.json(); // Lưu danh sách xe

                countDisplay.innerText = `Tìm thấy ${stationsData.length} trạm`;
                addMarkersToMap(stationsData);
                renderList(stationsData);

            } catch (error) {
                container.innerHTML = `<div class="bg-rose-50 border-2 border-rose-100 p-8 rounded-[2rem] text-center"><h3 class="font-black text-rose-800 text-lg">MẤT KẾT NỐI</h3></div>`;
                countDisplay.innerText = "Lỗi kết nối";
            }
        }

        function addMarkersToMap(stations) {
            map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });
            stations.forEach(s => {
                const lat = parseFloat(s.latitude); const lng = parseFloat(s.longitude);
                if (isNaN(lat) || isNaN(lng)) return;
                let iconClass = 'custom-marker' + (s.status === 'MAINTENANCE' ? ' maintenance' : '');
                const customIcon = L.divIcon({ className: '', html: `<div class="${iconClass}"><i class="fas fa-bicycle"></i></div>`, iconSize: [32, 32], iconAnchor: [16, 16] });
                const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map);
                marker.bindPopup(`<b>${s.name}</b><br>Sức chứa: ${s.capacity} xe`);
                // Bấm vào Marker cũng mở Modal xem xe
                marker.on('click', () => openBikeModal(s.stationId || s.id, s.name));
            });
            if (stations.length > 0) {
                const bounds = stations.filter(s => !isNaN(parseFloat(s.latitude))).map(s => [parseFloat(s.latitude), parseFloat(s.longitude)]);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        // ==========================================
        // 2. HIỂN THỊ DANH SÁCH TRẠM
        // ==========================================
        function renderList(list) {
            const container = document.getElementById('stationContainer');
            if (list.length === 0) { container.innerHTML = `<p class="text-center text-slate-400 py-10">Không có trạm nào.</p>`; return; }

            container.innerHTML = list.map(s => {
                const name = s.name || 'Chưa đặt tên';
                const capacity = s.capacity || 0;
                const status = s.status || 'AVAILABLE';
                const lat = parseFloat(s.latitude).toFixed(4);
                const lng = parseFloat(s.longitude).toFixed(4);
                const statusColor = status === 'MAINTENANCE' ? 'bg-amber-100 text-amber-600' : 'bg-emerald-100 text-emerald-600';
                const statusText = status === 'MAINTENANCE' ? 'Bảo trì' : 'Hoạt động';
                const stationId = s.stationId || s.id;

                return `
            <div class="station-card bg-white p-5 rounded-[2rem] shadow-sm flex justify-between items-center">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-2">
                        <div class="w-10 h-10 rounded-full ${status === 'MAINTENANCE' ? 'bg-amber-50 text-amber-500' : 'bg-emerald-50 text-emerald-500'} flex items-center justify-center">
                            <i class="fas fa-parking text-lg"></i>
                        </div>
                        <div>
                            <h3 class="font-extrabold text-slate-800 uppercase tracking-tight text-base">${name}</h3>
                            <p class="text-[11px] text-gray-400 font-medium"><i class="fas fa-map-pin mr-1"></i> Lat: ${lat}, Lng: ${lng}</p>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <div class="bg-slate-50 border border-slate-100 px-3 py-1.5 rounded-xl flex items-center gap-2">
                            <i class="fas fa-bicycle text-slate-500 text-xs"></i>
                            <p class="text-xs font-black text-slate-700">Sức chứa: ${capacity}</p>
                        </div>
                        <div class="${statusColor} px-3 py-1.5 rounded-xl flex items-center gap-2">
                            <i class="fas fa-circle text-[6px]"></i>
                            <p class="text-xs font-black">${statusText}</p>
                        </div>
                    </div>
                </div>

                <button onclick="openBikeModal(${stationId}, '${name}')"
                    class="bg-emerald-500 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-200 active:scale-90 transition-transform ml-4">
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>`;
            }).join('');
        }

        // ==========================================
        // 3. MODAL XEM XE TẠI TRẠM (FETCH & FILTER)
        // ==========================================
        function openBikeModal(stationId, stationName) {
            document.getElementById('modalTitle').innerText = `Xe tại trạm: ${stationName}`;

            // Lọc ra những xe có stationId khớp với trạm được bấm
            const bikesInStation = bikesData.filter(b => {
                const bStationId = b.stationId || (b.station && b.station.stationId);
                return bStationId === stationId;
            });

            const bikeContainer = document.getElementById('bikeListContainer');

            if (bikesInStation.length === 0) {
                bikeContainer.innerHTML = `<p class="text-center text-slate-400 py-10">Không có xe nào tại trạm này.</p>`;
            } else {
                bikeContainer.innerHTML = bikesInStation.map(bike => {
                    const statusColor = bike.status === 'AVAILABLE' ? 'bg-emerald-100 text-emerald-600' : (bike.status === 'MAINTENANCE' ? 'bg-amber-100 text-amber-600' : 'bg-slate-100 text-slate-600');
                    const statusIcon = bike.status === 'AVAILABLE' ? 'fa-check-circle' : (bike.status === 'MAINTENANCE' ? 'fa-wrench' : 'fa-bicycle');

                    return `
                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl ${statusColor} flex items-center justify-center text-xl">
                            <i class="fas ${statusIcon}"></i>
                        </div>
                        <div>
                            <p class="font-black text-slate-800 uppercase">${bike.bikeCode}</p>
                            <p class="text-[11px] text-gray-400">${bike.category ? bike.category.name : 'Standard'}</p>
                        </div>
                    </div>
                    <span class="text-[10px] font-black uppercase px-3 py-1 rounded-lg ${statusColor}">${bike.status}</span>
                </div>`;
                }).join('');
            }

            // Hiện Modal với hiệu ứng trượt lên
            document.getElementById('overlay').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('overlay').classList.add('opacity-100');
                document.getElementById('bikeModal').classList.add('active');
            }, 10);
        }

        function closeModal() {
            document.getElementById('bikeModal').classList.remove('active');
            document.getElementById('overlay').classList.remove('opacity-100');
            setTimeout(() => { document.getElementById('overlay').classList.add('hidden'); }, 300);
        }

        // ==========================================
        // 4. GPS & SEARCH (ĐÃ SỬA LỖI)
        // ==========================================
        function locateMe() {
            if (!navigator.geolocation) { alert("Trình duyệt không hỗ trợ GPS!"); return; }
            navigator.geolocation.getCurrentPosition(
                pos => {
                    map.flyTo([pos.coords.latitude, pos.coords.longitude], 16);
                    L.circleMarker([pos.coords.latitude, pos.coords.longitude], { radius: 8, fillColor: "#3b82f6", color: "#ffffff", weight: 3 }).addTo(map).bindPopup("Vị trí của bạn").openPopup();
                },
                () => { alert("Không lấy được vị trí."); }
            );
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();

            // Lọc danh sách trạm theo từ khóa
            const filteredStations = stationsData.filter(s => (s.name || '').toLowerCase().includes(val));

            // 🔴 SỬA TÊN HÀM TỪ renderStationList SANG renderList
            renderList(filteredStations);

            // Cập nhật lại Marker trên bản đồ cho khớp với kết quả tìm kiếm
            addMarkersToMap(filteredStations);

            // Cập nhật lại số lượng trạm tìm thấy
            document.getElementById('resultCount').innerText = `Tìm thấy ${filteredStations.length} trạm`;
        });

        // ==========================================
        // INIT
        // ==========================================
        window.onload = () => {
            initMap();
            fetchData();
        };
    </script>
</body>
</html>
