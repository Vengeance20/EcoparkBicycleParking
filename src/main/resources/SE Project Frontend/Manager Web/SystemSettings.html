<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecopark Admin - System Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Hiệu ứng đánh dấu vùng Admin */
        .admin-only { border: 2px solid #fee2e2; position: relative; }
        .admin-only::before { 
            content: "QUYỀN ADMIN"; 
            position: absolute; 
            top: -10px; 
            right: 20px; 
            background: #ef4444; 
            color: white; 
            font-size: 8px; 
            padding: 2px 8px; 
            border-radius: 4px; 
            font-weight: 900;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <button onclick="window.location.href='AdminPage.html'" class="group mb-6 text-gray-400 hover:text-[#00a859] font-bold text-sm flex items-center gap-2 transition-all">
            <div class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center group-hover:bg-green-50 transition-all">
                <i class="fas fa-chevron-left text-[10px]"></i>
            </div>
            QUAY LẠI DASHBOARD CHÍNH
        </button>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">Cấu hình hệ thống</h1>
                <p class="text-xs text-gray-400 mt-1 font-bold uppercase tracking-widest flex items-center gap-2" id="roleIndicator">
                    <i class="fas fa-user-shield text-red-500"></i> Quyền hạn: Admin
                </p>
            </div>
            
            <div class="flex bg-gray-200/50 p-1 rounded-2xl border border-gray-100 shadow-inner">
                <button onclick="setRole('admin')" id="btn-set-admin" class="px-4 py-2 rounded-xl text-[10px] font-black bg-white shadow-sm text-slate-800 transition-all">ADMIN</button>
                <button onclick="setRole('manager')" id="btn-set-manager" class="px-4 py-2 rounded-xl text-[10px] font-black text-slate-400 transition-all">MANAGER</button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            <div class="lg:col-span-1 space-y-2">
                <button onclick="showTab('price')" class="tab-btn w-full text-left p-4 rounded-2xl bg-[#00a859] text-white font-bold shadow-lg transition-all" id="btn-price">
                    <i class="fas fa-gas-pump mr-3 w-5"></i> Cấu hình giá
                </button>
                <button onclick="showTab('hours')" class="tab-btn w-full text-left p-4 rounded-2xl bg-white text-slate-500 font-bold hover:bg-gray-50 transition-all" id="btn-hours">
                    <i class="fas fa-clock mr-3 w-5"></i> Giờ hoạt động
                </button>
                <button onclick="showTab('roles')" class="tab-btn w-full text-left p-4 rounded-2xl bg-white text-slate-500 font-bold hover:bg-gray-50 transition-all" id="btn-roles">
                    <i class="fas fa-users-cog mr-3 w-5"></i> Phân quyền
                </button>
                <button onclick="showTab('danger')" class="tab-btn w-full text-left p-4 rounded-2xl bg-white text-red-400 font-bold hover:bg-red-50 transition-all" id="btn-danger">
                    <i class="fas fa-exclamation-triangle mr-3 w-5"></i> Vùng nguy hiểm
                </button>
            </div>

            <div class="lg:col-span-3">
                
                <div id="tab-price" class="tab-content active admin-only bg-white p-8 rounded-[35px] shadow-sm border border-gray-100">
                    <h3 class="text-sm font-black text-slate-800 uppercase mb-6">Bảng giá thuê xe toàn hệ thống</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Xe điện (VNĐ/giờ)</label>
                            <input type="text" value="20,000" class="role-lock w-full bg-gray-50 p-4 rounded-2xl border-2 border-transparent focus:border-green-500 outline-none font-bold">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] font-black text-gray-400 uppercase ml-2">Xe thường (VNĐ/giờ)</label>
                            <input type="text" value="10,000" class="role-lock w-full bg-gray-50 p-4 rounded-2xl border-2 border-transparent focus:border-green-500 outline-none font-bold">
                        </div>
                    </div>
                </div>

                <div id="tab-hours" class="tab-content bg-white p-8 rounded-[35px] shadow-sm border border-gray-100">
                    <h3 class="text-sm font-black text-slate-800 uppercase mb-6">Thời gian mở cửa trạm</h3>
                    <div class="space-y-4">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <span class="font-bold text-slate-700">Mở cửa trạm</span>
                            <input type="time" value="06:00" class="bg-white px-4 py-2 rounded-xl border border-gray-200 font-bold outline-none">
                        </div>
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl">
                            <span class="font-bold text-slate-700">Đóng cửa trạm</span>
                            <input type="time" value="22:00" class="bg-white px-4 py-2 rounded-xl border border-gray-200 font-bold outline-none">
                        </div>
                    </div>
                </div>

                <div id="tab-roles" class="tab-content admin-only bg-white p-8 rounded-[35px] shadow-sm border border-gray-100">
                    <h3 class="text-sm font-black text-slate-800 uppercase mb-6">Danh sách nhân sự điều hành</h3>
                    <div class="space-y-3">
                        <div class="flex items-center justify-between p-4 border border-gray-100 rounded-2xl">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-white text-xs font-bold">A</div>
                                <div><p class="text-sm font-bold text-slate-800">Nguyễn Admin</p><p class="text-[10px] text-gray-400 font-bold">Tài khoản tối cao</p></div>
                            </div>
                            <span class="text-[10px] font-black bg-red-100 text-red-600 px-3 py-1 rounded-lg uppercase">Admin</span>
                        </div>
                    </div>
                </div>

                <div id="tab-danger" class="tab-content admin-only bg-white p-8 rounded-[40px] shadow-sm border-2 border-red-50">
                    <div class="text-center space-y-4">
                        <div class="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center text-3xl mx-auto animate-pulse border-4 border-red-50">
                            <i class="fas fa-radiation"></i>
                        </div>
                        <h3 class="text-xl font-black text-red-600 uppercase">Dừng Hệ Thống Khẩn Cấp</h3>
                        <p class="text-sm text-gray-400 max-w-sm mx-auto leading-relaxed">Hành động này sẽ ngắt toàn bộ kết nối và từ chối mọi lượt thuê xe mới.</p>
                        <button onclick="triggerMaintenance()" id="btnDanger" class="w-full py-5 bg-red-600 text-white rounded-[25px] font-black text-sm shadow-xl shadow-red-100 hover:bg-red-700 transition-all active:scale-95">
                            XÁC NHẬN BẢO TRÌ TOÀN KHU
                        </button>
                    </div>
                </div>

                <button onclick="saveAll()" class="mt-8 w-full bg-slate-900 text-white py-5 rounded-[25px] font-bold shadow-xl hover:bg-slate-800 transition-all flex items-center justify-center gap-3">
                    LƯU TẤT CẢ THAY ĐỔI <i class="fas fa-check-circle text-green-400"></i>
                </button>

            </div>
        </div>
    </div>

    <script>
        let currentRole = 'admin';

        // Hàm chuyển Tab
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.replace('bg-[#00a859]', 'bg-white');
                b.classList.replace('text-white', 'text-slate-500');
            });

            document.getElementById('tab-' + tabId).classList.add('active');
            const btn = document.getElementById('btn-' + tabId);
            btn.classList.replace('bg-white', 'bg-[#00a859]');
            btn.classList.replace('text-slate-500', 'text-white');
        }

        // Hàm phân quyền giả lập
        function setRole(role) {
            currentRole = role;
            const indicator = document.getElementById('roleIndicator');
            const locks = document.querySelectorAll('.role-lock');
            const dangerBtn = document.getElementById('btnDanger');
            
            // UI cho nút chọn quyền
            const adminBtn = document.getElementById('btn-set-admin');
            const managerBtn = document.getElementById('btn-set-manager');

            if(role === 'manager') {
                indicator.innerHTML = '<i class="fas fa-user-tie text-blue-500"></i> Quyền hạn: MANAGER';
                locks.forEach(l => { l.disabled = true; l.parentElement.style.opacity = '0.5'; });
                dangerBtn.disabled = true;
                dangerBtn.classList.replace('bg-red-600', 'bg-gray-300');
                dangerBtn.innerText = "CHỈ ADMIN CÓ QUYỀN";
                
                managerBtn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                managerBtn.classList.remove('text-slate-400');
                adminBtn.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                adminBtn.classList.add('text-slate-400');
            } else {
                indicator.innerHTML = '<i class="fas fa-user-shield text-red-500"></i> Quyền hạn: ADMIN';
                locks.forEach(l => { l.disabled = false; l.parentElement.style.opacity = '1'; });
                dangerBtn.disabled = false;
                dangerBtn.classList.replace('bg-gray-300', 'bg-red-600');
                dangerBtn.innerText = "XÁC NHẬN BẢO TRÌ TOÀN KHU";

                adminBtn.classList.add('bg-white', 'shadow-sm', 'text-slate-800');
                adminBtn.classList.remove('text-slate-400');
                managerBtn.classList.remove('bg-white', 'shadow-sm', 'text-slate-800');
                managerBtn.classList.add('text-slate-400');
            }
        }

        function triggerMaintenance() {
            if(confirm("CẢNH BÁO: Toàn bộ hệ thống sẽ ngưng hoạt động. Bạn có chắc chắn muốn tiếp tục?")) {
                alert("Hệ thống Ecopark Bike đang chuyển sang chế độ BẢO TRÌ.");
            }
        }

        function saveAll() {
            alert("Đã lưu cấu hình thành công với quyền " + currentRole.toUpperCase());
        }
    </script>
</body>
</html>
